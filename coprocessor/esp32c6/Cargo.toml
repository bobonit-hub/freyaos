[package]
name = "freya-c6"
version = "0.1.0"
edition = "2021"
description = "ESP32-C6 network coprocessor firmware for Freya"
license = "MIT"
publish = false

[[bin]]
name = "freya-c6"
harness = false

[profile.release]
opt-level = "s"
debug = false
codegen-units = 1
lto = "fat"

[profile.dev]
opt-level = "z"
debug = true

[dependencies]

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
