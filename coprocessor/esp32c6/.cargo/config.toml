[build]
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "./flash.sh"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c6"
# The ESP-IDF release the firmware is built and tested with.  When an
# ESP-IDF environment is active (IDF_PATH set by export.sh) that tree is
# used instead of a managed download.
ESP_IDF_VERSION = "v5.5.5"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }

[alias]
# The pure modules (frame, rings, request parsing) on the build machine.
test-host = "test --lib --target x86_64-unknown-linux-gnu -Zbuild-std=std,panic_unwind"
