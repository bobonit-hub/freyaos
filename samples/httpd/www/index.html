<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Freya</title>
<style>
body { font-family: sans-serif; margin: 3em auto; max-width: 22em; padding: 0 1em; }
h1 { font-weight: normal; }
input { font: inherit; padding: .4em; width: 100%; box-sizing: border-box; margin: .3em 0 .8em; }
button { font: inherit; padding: .4em 1.2em; }
</style>
</head>
<body>
<h1>Freya</h1>
<form method="POST" action="/login" autocomplete="off">
<label for="password">Terminal password</label>
<input id="password" name="password" type="password" minlength="8" maxlength="8" autofocus required>
<button type="submit">Log in</button>
</form>
</body>
</html>
